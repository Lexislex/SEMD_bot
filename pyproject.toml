[project]
name = "semd-bot"
version = "2.2.0"
description = "FNSI update monitoring. Check SEMD version"
authors = [
    {name = "Alexey Alepko",email = "AlepkoAA@mos.ru"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "pytelegrambotapi (>=4.29.1,<5.0.0)",
    "schedule (>=1.2.2,<2.0.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "cachetools (>=6.2.4,<7.0.0)",
]

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "ruff>=0.6",
    "black>=24.0",
]

[tool.uv]
# Приложение, а не библиотека: uv не собирает и не устанавливает сам проект
package = false

[tool.black]
target-version = ["py310"]

[tool.pytest.ini_options]
# scripts/testing/*.py — ручные скрипты, не pytest-тесты
testpaths = ["tests"]