name: Deploy to Production

on:
  push:
    branches: [master]
  # Ручной перезапуск деплоя из вкладки Actions
  workflow_dispatch:

# Не запускать два деплоя одновременно
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/SEMD_bot
            SERVICE=semd-bot.service

            echo "=== Pulling latest code ==="
            git pull --ff-only origin master
            git log --oneline -1

            echo "=== Installing dependencies ==="
            # venv на сервере управляется uv; ставим недостающее, ничего не удаляя
            ~/.local/bin/uv sync --no-dev --no-install-project --inexact

            echo "=== Restarting service ==="
            # Требует правила в /etc/sudoers.d/semd-bot-deploy:
            # botman ALL=(root) NOPASSWD: /usr/bin/systemctl restart semd-bot.service, /usr/bin/journalctl -u semd-bot.service -n 30 --no-pager
            sudo -n /usr/bin/systemctl restart "$SERVICE"

            echo "=== Waiting for service to start ==="
            sleep 10

            echo "=== Checking service status ==="
            if systemctl is-active --quiet "$SERVICE"; then
              echo "✅ Service is running"
              systemctl status "$SERVICE" --no-pager
            else
              echo "❌ Service failed to start"
              sudo -n /usr/bin/journalctl -u "$SERVICE" -n 30 --no-pager || true
              exit 1
            fi

      - name: Notify on success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.BOT_TOKEN }}
          message: |
            ✅ Deploy successful

            Commit: ${{ github.sha }}
            By: ${{ github.actor }}

      - name: Notify on failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.BOT_TOKEN }}
          message: |
            ❌ Deploy FAILED

            Commit: ${{ github.sha }}
            By: ${{ github.actor }}

            Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
