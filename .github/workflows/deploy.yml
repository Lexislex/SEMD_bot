name: Deploy to Production

on:
  push:
    branches: [master]
  # Ручной перезапуск деплоя из вкладки Actions
  workflow_dispatch:

# Не запускать два деплоя одновременно
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Отпечаток ECDSA-ключа хоста lexislex.ru:2221 — защита от подмены сервера.
          # Проверить: ssh-keyscan -p 2221 lexislex.ru | ssh-keygen -lf -
          fingerprint: "SHA256:+0O2/DYZZEx21z3zb9i1QHa/cG3xDPrbgtlAFG3LIrA"
          # Ключ деплоя на сервере привязан к принудительной команде
          # ~/bin/semd-deploy.sh (scripts/deploy/semd-deploy.sh) — присланная
          # команда игнорируется, эта строка нужна только чтобы запустить сессию.
          script: deploy

      - name: Notify on success
        if: success()
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.BOT_TOKEN }}
          message: |
            ✅ Deploy successful

            Commit: ${{ github.sha }}
            By: ${{ github.actor }}

      - name: Notify on failure
        if: failure()
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.BOT_TOKEN }}
          message: |
            ❌ Deploy FAILED

            Commit: ${{ github.sha }}
            By: ${{ github.actor }}

            Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
